<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personal Wellness Intelligence</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0f1419;
        --fg: #e7ecf3;
        --accent: #3d9a6a;
        --muted: #8b949e;
      }
      body {
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main {
        max-width: 36rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
      }
      p {
        color: var(--muted);
        line-height: 1.6;
      }
      a {
        color: var(--accent);
      }
      .badge {
        display: inline-block;
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border: 1px solid var(--muted);
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="badge">Phase 0 — Planning</p>
      <h1>Personal Wellness Intelligence</h1>
      <p>
        Coach–client wellness analytics with a Google Forms + Sheets MVP first.
        Dashboard and AI-assisted chat come later—with guardrails.
      </p>
      <p>
        <a href="https://github.com/NOTJUANCORTES/personal-wellness-intelligence"
          >View planning repo on GitHub</a
        >
      </p>
    </main>
  </body>
</html>
